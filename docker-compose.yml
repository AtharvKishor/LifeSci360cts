version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "LifeSci@App2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LifeSci@App2024!' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db/create-login.sql:/create-login.sql
    command: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'LifeSci@App2024!' -i /create-login.sql -No
      "
    restart: "no"

  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5002:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  patientservice:
    build:
      context: .
      dockerfile: PatientService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5003:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  protocolservice:
    build:
      context: .
      dockerfile: ProtocolService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5004:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  reportingservice:
    build:
      context: .
      dockerfile: ReportingService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5005:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  sampleservice:
    build:
      context: .
      dockerfile: SampleService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5006:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  notificationservice:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ServicesDb: "Server=sqlserver,1433;Database=LifeSci360_Services;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5007:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  auditservice:
    build:
      context: .
      dockerfile: AuditService/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AuditDb: "Server=sqlserver,1433;Database=LifeSci360_Audit;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
