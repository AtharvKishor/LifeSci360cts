  auditlogservice:
    build:
      context: .
      dockerfile: AuditLogService.API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AuditDb: "Server=sqlserver,1433;Database=LifeSci360_Audit;User Id=lifesci_app;Password=LifeSci@App2024!;TrustServerCertificate=True;"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
    ports:
      - "5009:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Secret: "LifeSci360_JWT_Secret_Min_32_Chars_Here!"
      Services__AuthService: "http://authservice:8080"
      Services__PatientService: "http://patientservice:8080"
      Services__ProtocolService: "http://protocolservice:8080"
      Services__ReportingService: "http://reportingservice:8080"
      Services__SampleService: "http://sampleservice:8080"
      Services__NotificationService: "http://notificationservice:8080"
      Services__AuditService: "http://auditservice:8080"
      Services__AuditLogService: "http://auditlogservice:8080"
    ports:
      - "5000:8080"
    depends_on:
      - authservice
      - patientservice
      - protocolservice
      - reportingservice
      - sampleservice
      - notificationservice
      - auditservice
      - auditlogservice

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - gateway

volumes:
  sqldata:
